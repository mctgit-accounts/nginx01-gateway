# Wazuh agent — localfile blocks for nginx01-gateway.
# Add these to /var/ossec/etc/ossec.conf on the gateway (agent).
# Requires the agent to be enrolled with the manager (10.100.200.50:1514).

# nginx JSON access logs (structured — Wazuh parses the JSON fields).
<localfile>
  <log_format>json</log_format>
  <location>/var/log/nginx/*.access.log</location>
</localfile>

# nginx error logs (plain syslog — rate-limit hits, upstream errors).
<localfile>
  <log_format>syslog</log_format>
  <location>/var/log/nginx/*.error.log</location>
</localfile>

# fail2ban bans/unbans (parsed by the custom manager-side decoder).
<localfile>
  <log_format>syslog</log_format>
  <location>/var/log/fail2ban.log</location>
</localfile>
