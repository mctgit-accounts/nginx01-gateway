# http-level hardening (shipped as /etc/nginx/conf.d/00-http-hardening.conf)
# NOTE: server_tokens is set per-server in the vhost template and catch-all,
# because the distro nginx.conf already sets it in the http block
# (`server_tokens build;`) and a duplicate in the same context is fatal.
# Bound request headers so a client cannot exhaust memory with huge headers.
client_header_buffer_size 4k;
large_client_header_buffers 4 8k;
client_body_buffer_size 16k;
