# Catch-all server. Unknown hostnames get no service.
# Shipped as /etc/nginx/conf.d/00-default.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/blocked.access.log json;
    # Redirect everything to HTTPS.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/mankatotech/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mankatotech/privkey.pem;
    access_log /var/log/nginx/blocked.access.log json;
    # Unknown vhost: drop the connection.
    return 444;
}
