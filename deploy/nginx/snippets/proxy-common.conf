# Shared reverse-proxy settings.
# Shipped as /etc/nginx/snippets/proxy-common.conf
proxy_http_version 1.1;
proxy_set_header Host $host;

# nginx is the ONLY proxy in front of the apps, so client-supplied forwarding
# headers are not trustworthy. Overwrite them with the real remote address and
# drop the client's Forwarded header, so apps can safely trust these values.
# (Revisit if another proxy is ever placed in front of nginx.)
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header Forwarded "";

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_connect_timeout 10s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
client_max_body_size 25m;
